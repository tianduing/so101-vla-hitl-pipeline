  - Gripper endpoints map the released OPEN=65.7 to the Menagerie 41.7-degree open pickup aperture and CLOSE=40.0 to its -10-degree closed limit.
  - Wrist roll has insufficient variation in the released grids, so its prior orientation alignment is retained.
