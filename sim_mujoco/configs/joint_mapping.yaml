evidence:
  - Dataset feature names exactly match all six Menagerie joint and actuator names.
  - Dataset raw values are calibrated servo coordinates; they are not assumed to equal the MJCF joint angles one-for-one.
  - Pan/lift/elbow/flex scales and offsets are fitted from the released 35-point table and 35-point block-top calibration grids by SO-101 forward kinematics.
